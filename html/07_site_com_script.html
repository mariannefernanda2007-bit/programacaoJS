<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
     <h1>HTML com Script</h1>  
     <p>Aplicando programação dentro do HTML</p>
     <button onclick="mostrarmensagem()" >ver mensagem</button>

     <hr/>

     <p>Clique no botão</p>
     <button onclick="contarcliques()">Clique em mim</button>

     <script>

        let cliques = 0

        function contarcliques(){
            cliques = cliques + 1 
            if(cliques > 10){
            alert("Voce chegou no limite. pare. " )

        }else{
            alert("voce clicou " +cliques+ "vezes!")
        }
    }


        function mostrarmensagem(){
            console.log("olá mundo!")
            console.log("Misturando HTML com javascript")

            let resposta = prompt ("Oi,tudo bem?")

            if(resposta == "não"){
                alert("Ah que pena...")
            }else{
            alert("Que bom, aproveite porque passa")

            }
        }
        


     </script>

</body>
</html>
